<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Заявки — IT Doctor</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #151d2e;
      --panel-2: #1c2639;
      --border: #26314a;
      --text: #e8edf7;
      --muted: #93a1bd;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --ready: #06b6d4;
      --done: #64748b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap { max-width: 1200px; margin: 0 auto; }

    header.top {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 { font-size: 22px; margin: 0; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 16px;
    }

    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    /* --- Вход --- */
    #login { max-width: 420px; margin: 10vh auto 0; }
    #login h1 { margin-bottom: 6px; }
    #login p { color: var(--muted); margin: 0 0 18px; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      margin-bottom: 14px;
    }

    .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 10px; }

    /* --- Статистика --- */
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 120px;
    }
    .stat b { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 13px; }

    /* --- Таблица --- */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 15px; }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }

    td.nowrap { white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge.new { background: rgba(59,130,246,.16); color: #93c5fd; border-color: rgba(59,130,246,.4); }
    .badge.in_progress { background: rgba(245,158,11,.16); color: #fcd34d; border-color: rgba(245,158,11,.4); }
    .badge.ready { background: rgba(6,182,212,.16); color: #67e8f9; border-color: rgba(6,182,212,.4); }
    .badge.completed { background: rgba(100,116,139,.2); color: #cbd5e1; border-color: rgba(100,116,139,.5); }

    .source { color: var(--muted); font-size: 13px; }

    select {
      font: inherit;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }

    .msg { color: var(--muted); font-size: 13px; max-width: 320px; }

    /* Кликабельные заголовки: сортировка по столбцу */
    button.sort {
      all: unset;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
    }

    button.sort:hover { color: var(--text); }
    button.sort[data-active="true"] { color: var(--text); font-weight: 600; }

    button.sort .arrow { font-size: 11px; opacity: .7; }
    button.sort[data-active="true"] .arrow { opacity: 1; }

    /* Панель фильтров */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { margin: 0; }
    .field select, .field input[type="date"], .field input[type="search"] {
      font: inherit;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      min-width: 150px;
    }

    .field input[type="date"] { min-width: 150px; }
    .field input[type="search"] { min-width: 190px; }
    .filters .spacer { flex: 1; }
    .filters .count { color: var(--muted); font-size: 13px; }

    .muted { color: var(--muted); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    .saved { color: var(--ok); font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>

<!-- Вход -->
<section class="card" id="login">
  <h1>Заявки IT Doctor</h1>
  <p>Введите пароль владельца, чтобы открыть список заявок.</p>
  <label for="key">Пароль</label>
  <input type="password" id="key" autocomplete="current-password" placeholder="пароль" />
  <button class="primary" id="loginBtn" style="width:100%">Войти</button>
  <div class="error" id="loginError"></div>
</section>

<!-- Панель -->
<section id="panel" hidden>
  <header class="top">
    <div>
      <h1>Заявки</h1>
      <div class="sub" id="updated">—</div>
    </div>
    <div>
      <button id="refreshBtn">Обновить</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <!-- Фильтры -->
  <div class="filters">
    <div class="field">
      <label for="fStatus">Статус</label>
      <select id="fStatus"><option value="">Все</option></select>
    </div>

    <div class="field">
      <label for="fSource">Источник</label>
      <select id="fSource">
        <option value="">Все</option>
        <option value="website">Сайт</option>
        <option value="mini_app">Mini App</option>
        <option value="telegram_bot">Telegram-бот</option>
      </select>
    </div>

    <div class="field">
      <label for="fService">Услуга</label>
      <select id="fService"><option value="">Все</option></select>
    </div>

    <div class="field">
      <label for="fPeriod">Период</label>
      <select id="fPeriod">
        <option value="">За всё время</option>
        <option value="today">Сегодня</option>
        <option value="7">7 дней</option>
        <option value="30">30 дней</option>
        <option value="custom">Свой промежуток</option>
      </select>
    </div>

    <div class="field" id="fFromWrap" hidden>
      <label for="fFrom">С даты</label>
      <input type="date" id="fFrom" />
    </div>

    <div class="field" id="fToWrap" hidden>
      <label for="fTo">По дату</label>
      <input type="date" id="fTo" />
    </div>

    <div class="field">
      <label for="fSearch">Поиск по имени или телефону</label>
      <input type="search" id="fSearch" placeholder="Иван или 999" />
    </div>

    <div class="spacer"></div>

    <button id="resetFilters">Сбросить фильтры</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" class="sort" data-sort="date">Дата<span class="arrow"></span></button></th>
            <th><button type="button" class="sort" data-sort="name">Имя<span class="arrow"></span></button></th>
            <th><button type="button" class="sort" data-sort="phone">Телефон<span class="arrow"></span></button></th>
            <th><button type="button" class="sort" data-sort="service">Услуга<span class="arrow"></span></button></th>
            <th>Сообщение</th>
            <th><button type="button" class="sort" data-sort="source">Источник<span class="arrow"></span></button></th>
            <th><button type="button" class="sort" data-sort="status">Статус<span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>Заявок пока нет.</div>
  </div>
</section>

<script>
  const SOURCE_LABELS = {
    website: "Сайт",
    mini_app: "Mini App",
    telegram_bot: "Telegram-бот"
  };

  const STATUS_LABELS = {
    new: "Новая",
    in_progress: "В работе",
    ready: "Готова",
    completed: "Завершена"
  };

  const STATUS_ORDER = ["new", "in_progress", "ready", "completed"];

  const loginCard = document.getElementById("login");
  const panel = document.getElementById("panel");
  const keyInput = document.getElementById("key");
  const loginError = document.getElementById("loginError");
  const rowsBody = document.getElementById("rows");
  const emptyBox = document.getElementById("empty");
  const statsBox = document.getElementById("stats");
  const updatedBox = document.getElementById("updated");

  let statuses = STATUS_ORDER.map((value) => ({ value, label: STATUS_LABELS[value] }));

  // Текущая сортировка. По умолчанию — новые заявки сверху.
  // Выбор запоминается в sessionStorage, чтобы пережить обновление страницы.
  const DEFAULT_SORT = { key: "date", dir: "desc" };

  function readSort() {
    try {
      const saved = JSON.parse(sessionStorage.getItem("itd_admin_sort") || "null");
      if (saved && ["date", "name", "phone", "service", "source", "status"].includes(saved.key)) {
        return { key: saved.key, dir: saved.dir === "asc" ? "asc" : "desc" };
      }
    } catch {
      // ignore
    }
    return { ...DEFAULT_SORT };
  }

  let sort = readSort();

  // Фильтры. Пустое значение означает «показывать всё».
  const EMPTY_FILTERS = {
    status: "",
    source: "",
    service: "",
    period: "",
    from: "",
    to: "",
    q: ""
  };

  function readFilters() {
    try {
      const saved = JSON.parse(sessionStorage.getItem("itd_admin_filters") || "null");
      if (saved && typeof saved === "object") {
        return { ...EMPTY_FILTERS, ...saved };
      }
    } catch {
      // ignore
    }
    return { ...EMPTY_FILTERS };
  }

  let filters = readFilters();

  // Элементы фильтров.
  const fStatus = document.getElementById("fStatus");
  const fSource = document.getElementById("fSource");
  const fService = document.getElementById("fService");
  const fPeriod = document.getElementById("fPeriod");
  const fFrom = document.getElementById("fFrom");
  const fTo = document.getElementById("fTo");
  const fSearch = document.getElementById("fSearch");
  const fFromWrap = document.getElementById("fFromWrap");
  const fToWrap = document.getElementById("fToWrap");

  /** Дата в формате 2026-10-07 по местному времени. */
  function isoDay(date) {
    const d = new Date(date);
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${month}-${day}`;
  }

  /** Превращает выбранный период в пару дат «с» и «по». */
  function periodRange() {
    if (filters.period === "today") {
      const today = isoDay(new Date());
      return { from: today, to: today };
    }

    if (filters.period === "7" || filters.period === "30") {
      const days = Number(filters.period);
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - (days - 1));
      return { from: isoDay(from), to: isoDay(to) };
    }

    if (filters.period === "custom") {
      return { from: filters.from, to: filters.to };
    }

    return { from: "", to: "" };
  }

  // --- Помощники ---------------------------------------------------------

  function formatDate(iso) {
    try {
      return new Intl.DateTimeFormat("ru-RU", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "Europe/Moscow"
      }).format(new Date(iso));
    } catch {
      return iso;
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  async function api(method, body, query) {
    const options = { method, credentials: "same-origin", headers: {} };

    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }

    const response = await fetch(`/api/leads${query || ""}`, options);
    let payload = {};

    try {
      payload = await response.json();
    } catch {
      payload = {};
    }

    return { status: response.status, payload };
  }

  function currentQuery() {
    const parts = new URLSearchParams();
    parts.set("sort", sort.key);
    parts.set("dir", sort.dir);

    if (filters.status) parts.set("status", filters.status);
    if (filters.source) parts.set("source", filters.source);
    if (filters.service) parts.set("service", filters.service);
    if (filters.q.trim()) parts.set("q", filters.q.trim());

    const { from, to } = periodRange();
    if (from) parts.set("from", from);
    if (to) parts.set("to", to);

    return `?${parts.toString()}`;
  }

  /** Показывает поля дат только для своего промежутка. */
  function syncPeriodInputs() {
    const custom = filters.period === "custom";
    fFromWrap.hidden = !custom;
    fToWrap.hidden = !custom;
    fFrom.value = filters.from || "";
    fTo.value = filters.to || "";
  }

  /** Заполняет выпадающие списки статусов и услуг. */
  function fillFilterOptions(services, hasEmpty) {
    // Статусы.
    fStatus.innerHTML = '<option value="">Все</option>' + statuses
      .map((s) => `<option value="${s.value}">${escapeHtml(s.label)}</option>`)
      .join("");
    fStatus.value = filters.status;

    // Услуги: пересобираем список, сохраняя выбор.
    const options = ['<option value="">Все</option>'];
    if (hasEmpty) {
      options.push('<option value="none">(не выбрана)</option>');
    }
    for (const service of services) {
      options.push(`<option value="${escapeHtml(service)}">${escapeHtml(service)}</option>`);
    }
    fService.innerHTML = options.join("");

    // Если выбранной услуги больше нет в списке — сбрасываем фильтр.
    if (filters.service && !services.includes(filters.service) && filters.service !== "none") {
      filters.service = "";
      sessionStorage.setItem("itd_admin_filters", JSON.stringify(filters));
    }
    fService.value = filters.service;
  }

  /** Загружает список услуг для фильтра. */
  async function loadServices() {
    const { status, payload } = await api("GET", undefined, "?facets=1");
    if (status === 200 && payload.ok) {
      fillFilterOptions(payload.services || [], Boolean(payload.hasEmpty));
    } else {
      fillFilterOptions([], false);
    }
  }

  /** Обновляет стрелки у заголовков таблицы. */
  function renderSortIndicators() {
    document.querySelectorAll("button.sort").forEach((button) => {
      const active = button.dataset.sort === sort.key;
      button.dataset.active = active ? "true" : "false";
      const arrow = button.querySelector(".arrow");
      if (arrow) {
        arrow.textContent = active ? (sort.dir === "asc" ? "↑" : "↓") : "↕";
      }
    });
  }


  // --- Вход --------------------------------------------------------------

  async function login(key) {
    const { status, payload } = await api("POST", { key });

    if (status === 200 && payload.ok) {
      sessionStorage.setItem("itd_admin_key", key);
      showPanel();
      await load();
      return;
    }

    loginError.textContent = payload.error || "Не удалось войти";
    sessionStorage.removeItem("itd_admin_key");
  }

  function showPanel() {
    loginCard.hidden = true;
    panel.hidden = false;
  }

  function showLogin() {
    panel.hidden = true;
    loginCard.hidden = false;
    keyInput.value = "";
    keyInput.focus();
  }

  // --- Загрузка списка ---------------------------------------------------

  async function load() {
    renderSortIndicators();
    const { status, payload } = await api("GET", undefined, currentQuery());

    if (status === 401) {
      sessionStorage.removeItem("itd_admin_key");
      showLogin();
      loginError.textContent = "Сессия истекла, войдите заново";
      return;
    }

    if (!payload.ok) {
      updatedBox.textContent = payload.error || "Ошибка загрузки";
      return;
    }

    if (Array.isArray(payload.statuses) && payload.statuses.length) {
      statuses = payload.statuses;
    }

    render(payload.leads || []);
    // Список услуг для фильтра подтягиваем отдельно: он меняется редко.
    await loadServices();
  }

  /** Перечитывает список после смены фильтра. */
  function applyFilters() {
    sessionStorage.setItem("itd_admin_filters", JSON.stringify(filters));
    syncPeriodInputs();
    load();
  }

  function render(leads) {
    updatedBox.textContent = "Обновлено: " +
      new Intl.DateTimeFormat("ru-RU", { timeStyle: "medium" }).format(new Date()) +
      " · всего: " + leads.length;

    // Статистика по статусам.
    const counts = {};
    for (const lead of leads) {
      counts[lead.status] = (counts[lead.status] || 0) + 1;
    }

    statsBox.innerHTML = statuses
      .map((s) => `<div class="stat"><b>${counts[s.value] || 0}</b><span>${escapeHtml(s.label)}</span></div>`)
      .join("");

    emptyBox.hidden = leads.length > 0;

    rowsBody.innerHTML = leads.map((lead) => {
      const options = statuses
        .map((s) => `<option value="${s.value}"${s.value === lead.status ? " selected" : ""}>${escapeHtml(s.label)}</option>`)
        .join("");

      return `
        <tr data-id="${escapeHtml(lead.id)}">
          <td class="nowrap">${escapeHtml(formatDate(lead.created_at))}</td>
          <td>${escapeHtml(lead.name)}</td>
          <td class="nowrap">${escapeHtml(lead.phone)}</td>
          <td>${escapeHtml(lead.service || "—")}</td>
          <td class="msg">${escapeHtml(lead.message || "—")}</td>
          <td class="source">${escapeHtml(SOURCE_LABELS[lead.source] || lead.source)}</td>
          <td class="nowrap">
            <select data-role="status">${options}</select>
            <span class="saved" data-role="saved" hidden>сохранено</span>
          </td>
        </tr>`;
    }).join("");
  }

  // --- Смена статуса -----------------------------------------------------

  async function changeStatus(row, select) {
    const id = row.getAttribute("data-id");
    const status = select.value;
    const saved = row.querySelector('[data-role="saved"]');

    select.disabled = true;
    saved.hidden = true;

    try {
      const { status: httpStatus, payload } = await api("PATCH", { id, status });

      if (httpStatus === 200 && payload.ok) {
        saved.hidden = false;
        setTimeout(() => { saved.hidden = true; }, 2000);
        return;
      }

      if (httpStatus === 401) {
        showLogin();
        loginError.textContent = "Сессия истекла, войдите заново";
        return;
      }

      alert(payload.error || "Не удалось сохранить статус");
      await load();
    } catch {
      alert("Сеть недоступна, статус не сохранён");
      await load();
    } finally {
      select.disabled = false;
    }
  }

  // --- События -----------------------------------------------------------

  document.getElementById("loginBtn").addEventListener("click", () => login(keyInput.value));

  keyInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") login(keyInput.value);
  });

  document.getElementById("refreshBtn").addEventListener("click", () => load());

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    sessionStorage.removeItem("itd_admin_key");
    // Пустой ключ на сервере означает выход: cookie стирается, доступ закрыт.
    await api("POST", { key: "" });
    showLogin();
  });

  rowsBody.addEventListener("change", (event) => {
    const select = event.target.closest('[data-role="status"]');
    if (!select) return;
    changeStatus(select.closest("tr"), select);
  });

  // --- Фильтры -----------------------------------------------------------

  fStatus.addEventListener("change", () => {
    filters.status = fStatus.value;
    applyFilters();
  });

  fSource.addEventListener("change", () => {
    filters.source = fSource.value;
    applyFilters();
  });

  fService.addEventListener("change", () => {
    filters.service = fService.value;
    applyFilters();
  });

  fPeriod.addEventListener("change", () => {
    filters.period = fPeriod.value;

    // Для «своего промежутка» подставляем последние 30 дней как заготовку.
    if (filters.period === "custom" && !filters.from && !filters.to) {
      const today = isoDay(new Date());
      const start = new Date();
      start.setDate(start.getDate() - 29);
      filters.from = isoDay(start);
      filters.to = today;
    }

    applyFilters();
  });

  fFrom.addEventListener("change", () => {
    filters.from = fFrom.value;
    // Если «с» позже «по» — подтягиваем «по» до той же даты.
    if (filters.from && filters.to && filters.from > filters.to) {
      filters.to = filters.from;
    }
    applyFilters();
  });

  fTo.addEventListener("change", () => {
    filters.to = fTo.value;
    if (filters.from && filters.to && filters.to < filters.from) {
      filters.from = filters.to;
    }
    applyFilters();
  });

  // Поиск: ждём паузу в наборе, чтобы не дёргать базу на каждую букву.
  let searchTimer = null;
  fSearch.addEventListener("input", () => {
    filters.q = fSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      sessionStorage.setItem("itd_admin_filters", JSON.stringify(filters));
      load();
    }, 350);
  });

  document.getElementById("resetFilters").addEventListener("click", () => {
    filters = { ...EMPTY_FILTERS };
    fStatus.value = "";
    fSource.value = "";
    fService.value = "";
    fPeriod.value = "";
    fSearch.value = "";
    applyFilters();
  });

  // Клик по заголовку: первый раз сортирует по возрастанию, повторный — по убыванию.
  // Клик по другому столбцу начинает с убывания для даты и с возрастания для остальных.
  document.querySelector("thead").addEventListener("click", (event) => {
    const button = event.target.closest("button.sort");
    if (!button) return;

    const key = button.dataset.sort;
    if (sort.key === key) {
      sort.dir = sort.dir === "asc" ? "desc" : "asc";
    } else {
      sort = { key, dir: key === "date" ? "desc" : "asc" };
    }

    sessionStorage.setItem("itd_admin_sort", JSON.stringify(sort));
    load();
  });

  // --- Старт -------------------------------------------------------------

  // Восстанавливаем выбранные фильтры в полях панели.
  fStatus.value = filters.status;
  fSource.value = filters.source;
  fSearch.value = filters.q;
  fPeriod.value = filters.period;
  syncPeriodInputs();

  // Если пароль уже вводили в этой вкладке — сразу открываем список.
  const savedKey = sessionStorage.getItem("itd_admin_key");
  if (savedKey) {
    login(savedKey);
  } else {
    showLogin();
  }
</script>
</body>
</html>
