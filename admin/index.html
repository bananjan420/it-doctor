<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0B0E14" />
  <title>Заявки — IT Doctor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Оформление повторяет клиентский сайт: те же цвета, шрифт и радиусы. */
    :root {
      --bg-primary: #0B0E14;
      --bg-secondary: #0F141C;
      --bg-card: #151A24;
      --bg-card-hover: #1A2130;
      --accent: #00D4FF;
      --accent-secondary: #0072FF;
      --accent-gradient: linear-gradient(135deg, #00D4FF 0%, #0072FF 100%);
      --text-primary: #FFFFFF;
      --text-secondary: #A0AEC0;
      --text-muted: #6B7A8D;
      --border: rgba(0, 212, 255, 0.15);
      --border-strong: rgba(0, 212, 255, 0.35);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      --shadow-accent: 0 8px 32px rgba(0, 212, 255, 0.25);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px 72px;
      background:
        radial-gradient(circle at 15% 0%, rgba(0, 212, 255, 0.08), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(0, 114, 255, 0.08), transparent 45%),
        var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      font: 16px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap { max-width: 1400px; margin: 0 auto; }

    /* --- Кнопки --- */
    button {
      font: inherit;
      cursor: pointer;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 10px 16px;
      transition: all var(--transition);
    }

    button:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }

    button.primary {
      background: var(--accent-gradient);
      border: none;
      color: #04121A;
      font-weight: 700;
      box-shadow: var(--shadow-accent);
    }

    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: default; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    /* Окно фильтра выходит за границу карточки, поэтому обрезку отключаем */
    .table-card { overflow: visible; }

    /* --- Вход --- */
    #login { max-width: 420px; margin: 12vh auto 0; text-align: center; }

    .brand {
      width: 58px; height: 58px; margin: 0 auto 16px;
      border-radius: 16px;
      background: var(--accent-gradient);
      color: #04121A;
      font-weight: 800; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-accent);
    }

    #login h1 {
      font-size: 24px; margin: 0 0 8px;
      background: var(--accent-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #login p { color: var(--text-secondary); margin: 0 0 22px; font-size: 14px; }

    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-align: left; letter-spacing: .02em; text-transform: uppercase; }

    input[type="password"], input[type="date"], input[type="search"], input[type="text"], select {
      width: 100%;
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font: inherit;
      transition: border-color var(--transition);
    }

    input:focus, select:focus { outline: none; border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }
    input[type="password"] { margin-bottom: 14px; }

    .error { color: #FF6B6B; font-size: 14px; min-height: 20px; margin-top: 12px; }

    /* --- Шапка панели --- */
    header.top {
      display: flex; flex-wrap: wrap; gap: 16px;
      align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }

    header.top h1 { font-size: 26px; margin: 0; font-weight: 800; }
    header.top h1 span {
      background: var(--accent-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 10px; }

    /* --- Счётчики --- */
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      min-width: 132px;
      position: relative;
      overflow: hidden;
    }

    .stat::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
      background: var(--accent-gradient);
    }

    .stat b { display: block; font-size: 24px; font-weight: 800; }
    .stat span { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }

    /* --- Панель фильтров: всегда на виду --- */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: flex-start;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .fb-item { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
    .fb-item.fb-search { flex: 1; min-width: 200px; }
    .fb-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }

    .filter-bar select,
    .filter-bar input[type="search"],
    .filter-bar input[type="date"] {
      font-size: 13px;
      padding: 8px 10px;
    }

    .fb-reset { align-self: flex-end; font-size: 13px; padding: 9px 14px; }

    /* Мягкая подсветка: значок в шапке подсказывает, куда смотреть */
    .fb-flash .fb-label,
    .fb-flash .fb-toggle { color: var(--accent); }

    .fb-flash { animation: fb-flash 1.2s ease; }

    @keyframes fb-flash {
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, .45); }
      100% { box-shadow: 0 0 0 12px rgba(0, 212, 255, 0); }
    }

    /* Список с галочками прямо в панели, без всплывающих окон */
    .filter-bar .multi { position: relative; }
    .filter-bar .multi-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 60;
      min-width: 220px;
      max-height: 280px;
      overflow-y: auto;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      display: none;
    }

    /* Открытый список показываем, закрытый — прячем */
    .filter-bar .multi[data-open="true"] .multi-panel { display: block; }

    /* Кнопка, которая открывает список: показывает, что выбрано */
    .fb-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-size: 13px;
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fb-toggle[data-filled="true"] {
      color: var(--accent);
      border-color: var(--border-strong);
      background: rgba(0, 212, 255, .08);
    }

    /* --- Таблица --- */
    /* Обёртке нельзя обрезать содержимое: иначе окно фильтра пропадает.
       Вместо прокрутки таблица сама ужимается по ширине экрана. */
    .table-card { padding: 0 0 8px; }
    .table-wrap { overflow: visible; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: auto; }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: top;
    }

    /* Текст заявки переносится, чтобы таблица не расползалась */
    td.msg { white-space: normal; overflow-wrap: anywhere; }

    /* Шапка намеренно лёгкая: только подписи и значки фильтров. */
    thead th {
      background: transparent;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      vertical-align: middle;
      padding: 12px;
      white-space: nowrap;
    }

    /* Заголовок столбца и значок фильтра в одну строку */
    .th-top { display: flex; align-items: center; gap: 6px; }

    /* Значок фильтра появляется при наведении на столбец */
    .filter-btn {
      all: unset;
      position: relative;
      cursor: pointer;
      width: 22px; height: 22px;
      border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity var(--transition), color var(--transition), background var(--transition);
    }

    .filter-btn svg { width: 14px; height: 14px; display: block; }

    th:hover .filter-btn,
    .filter-btn:focus-visible { opacity: .75; }

    .filter-btn:hover { opacity: 1; color: var(--accent); background: rgba(0, 212, 255, .12); }

    /* Активный фильтр видно всегда и он бирюзовый */
    .filter-btn[data-active="true"] {
      opacity: 1;
      color: var(--accent);
      background: rgba(0, 212, 255, .18);
      box-shadow: 0 0 10px rgba(0, 212, 255, .35);
    }

    .filter-btn[data-active="true"] svg { stroke: var(--accent); }

    /* Точка-напоминание, что в столбце есть активный фильтр */
    .filter-btn[data-active="true"]::after {
      content: "";
      position: absolute;
      top: 2px; right: 2px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(0, 212, 255, .9);
    }


    .pop-clear:hover { color: var(--accent); border-color: var(--border-strong); }

    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: var(--bg-card-hover); }
    tbody tr:last-child td { border-bottom: none; }

    td.nowrap { white-space: nowrap; }

    /* Заголовок-кнопка сортировки */
    button.sort {
      all: unset;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 0;
      transition: color var(--transition);
    }

    button.sort:hover { color: var(--accent); }
    button.sort[data-active="true"] { color: var(--accent); }
    button.sort .arrow { font-size: 11px; opacity: .6; }
    button.sort[data-active="true"] .arrow { opacity: 1; }

    /* Фильтры прямо в шапке таблицы */
    .filter-cell { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .filter-cell input, .filter-cell select { font-size: 13px; padding: 7px 9px; }
    .date-range { display: flex; gap: 6px; }
    .date-range input { min-width: 0; }

    /* Выпадающий список с галочками */
    .multi { position: relative; }

    .multi > button {
      width: 100%;
      text-align: left;
      font-size: 13px;
      padding: 7px 9px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .multi > button[data-filled="true"] { color: var(--accent); border-color: var(--border-strong); }

    /* Список значений живёт внутри окна фильтра: своих рамок и тени ему
       не нужно, иначе получается «коробка в коробке». */
    .multi-panel {
      position: static;
      max-height: 260px;
      overflow-y: auto;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .multi-panel label:first-child { margin-top: 0; }
    .multi-empty { color: var(--text-muted); font-size: 13px; margin: 4px 2px; }

    .multi-panel[hidden] { display: none; }

    .multi-panel label {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: none;
      letter-spacing: 0;
      margin: 0;
      transition: background var(--transition);
    }

    .multi-panel label:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .multi-panel input[type="checkbox"] { width: auto; accent-color: var(--accent); }
    .multi-panel .panel-actions { display: flex; gap: 8px; padding: 6px 4px 2px; }
    .multi-panel .panel-actions button { flex: 1; font-size: 12px; padding: 7px; }

    /* --- Бейджи --- */
    .badge {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.new { background: rgba(0, 212, 255, .14); color: var(--accent); }
    .badge.in_progress { background: rgba(255, 176, 32, .16); color: #FFB020; }
    .badge.completed { background: rgba(34, 197, 94, .16); color: #34D399; }

    .source { color: var(--text-muted); font-size: 12px; }
    .msg { color: var(--text-secondary); font-size: 13px; max-width: 300px; }

    select.status-select { width: auto; font-size: 13px; padding: 7px 10px; }

    .muted { color: var(--text-muted); }
    .empty { padding: 44px; text-align: center; color: var(--text-muted); }
    .saved { color: #34D399; font-size: 12px; margin-left: 8px; }

    /* На узких экранах возвращаем прокрутку таблицы: там окно фильтра
       открывается редко, а разъехавшаяся таблица мешает всегда. */
    @media (max-width: 900px) {
      .table-wrap { overflow-x: auto; }
    }

    @media (max-width: 760px) {
      body { padding: 20px 12px 56px; }
      header.top h1 { font-size: 20px; }
      .stat { min-width: 104px; padding: 11px 14px; }
      .stat b { font-size: 20px; }
    }
  </style>
</head>
<body>

<!-- Вход -->
<section class="card" id="login">
  <div class="brand">IT</div>
  <h1>Заявки IT Doctor</h1>
  <p>Панель владельца сервиса</p>
  <label for="key">Пароль</label>
  <input type="password" id="key" autocomplete="current-password" placeholder="введите пароль" />
  <button class="primary" id="loginBtn" style="width:100%">Войти</button>
  <div class="error" id="loginError"></div>
</section>

<!-- Панель -->
<section id="panel" hidden>
  <header class="top">
    <div>
      <h1>Заявки <span>IT Doctor</span></h1>
      <div class="sub" id="updated">—</div>
    </div>
    <div class="actions">
      <button id="refreshBtn">Обновить</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <!-- Фильтры видно всегда: так их невозможно не найти -->
  <div class="filter-bar">
    <div class="fb-item" data-fb="status">
      <span class="fb-label">Статус</span>
      <div class="multi" data-multi="status"><button type="button" class="fb-toggle" data-fb-toggle="status">Все статусы</button><div class="multi-panel" data-multi-panel></div></div>
    </div>

    <div class="fb-item" data-fb="source">
      <span class="fb-label">Источник</span>
      <div class="multi" data-multi="source"><button type="button" class="fb-toggle" data-fb-toggle="source">Все источники</button><div class="multi-panel" data-multi-panel></div></div>
    </div>

    <div class="fb-item" data-fb="service">
      <span class="fb-label">Услуга</span>
      <div class="multi" data-multi="service"><button type="button" class="fb-toggle" data-fb-toggle="service">Все услуги</button><div class="multi-panel" data-multi-panel></div></div>
    </div>

    <div class="fb-item" data-fb="date">
      <span class="fb-label">Период</span>
      <select id="fPreset">
        <option value="">За всё время</option>
        <option value="today">Сегодня</option>
        <option value="yesterday">Вчера</option>
        <option value="week">Эта неделя</option>
        <option value="lastWeek">Прошлая неделя</option>
        <option value="month">Этот месяц</option>
        <option value="lastMonth">Прошлый месяц</option>
        <option value="7">Последние 7 дней</option>
        <option value="30">Последние 30 дней</option>
        <option value="custom">Свой промежуток</option>
      </select>
      <div class="date-range" id="customRange" hidden>
        <input type="date" id="fFrom" title="С даты" />
        <input type="date" id="fTo" title="По дату" />
      </div>
    </div>

    <div class="fb-item fb-search" data-fb="search">
      <span class="fb-label">Поиск</span>
      <input type="search" id="fSearch" placeholder="имя, телефон, текст" />
    </div>

    <button type="button" class="fb-reset" id="resetFilters">Сбросить всё</button>
  </div>

  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><div class="th-top"><button type="button" class="sort" data-sort="date">Дата<span class="arrow"></span></button><button type="button" class="filter-btn" data-filter-toggle="date" aria-label="Фильтр: Дата" title="Настроить фильтр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div></th>
            <th><div class="th-top"><button type="button" class="sort" data-sort="name">Имя<span class="arrow"></span></button><button type="button" class="filter-btn" data-filter-toggle="search" aria-label="Фильтр: Имя" title="Настроить фильтр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div></th>
            <th><div class="th-top"><button type="button" class="sort" data-sort="phone">Телефон<span class="arrow"></span></button></div></th>
            <th><div class="th-top"><button type="button" class="sort" data-sort="service">Услуга<span class="arrow"></span></button><button type="button" class="filter-btn" data-filter-toggle="service" aria-label="Фильтр: Услуга" title="Настроить фильтр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div></th>
            <th>Сообщение</th>
            <th><div class="th-top"><button type="button" class="sort" data-sort="source">Источник<span class="arrow"></span></button><button type="button" class="filter-btn" data-filter-toggle="source" aria-label="Фильтр: Источник" title="Настроить фильтр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div></th>
            <th><div class="th-top"><button type="button" class="sort" data-sort="status">Статус<span class="arrow"></span></button><button type="button" class="filter-btn" data-filter-toggle="status" aria-label="Фильтр: Статус" title="Настроить фильтр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>По выбранным фильтрам заявок нет.</div>
  </div>
</section>

<script>
  const SOURCE_LABELS = {
    website: "Сайт",
    mini_app: "Mini App",
    telegram_bot: "Telegram-бот",
    account: "Личный кабинет"
  };

  const STATUS_LABELS = {
    new: "Новая",
    in_progress: "В работе",
    completed: "Завершена"
  };

  const loginCard = document.getElementById("login");
  const panel = document.getElementById("panel");
  const keyInput = document.getElementById("key");
  const loginError = document.getElementById("loginError");
  const rowsBody = document.getElementById("rows");
  const emptyBox = document.getElementById("empty");
  const statsBox = document.getElementById("stats");
  const updatedBox = document.getElementById("updated");

  const fSearch = document.getElementById("fSearch");
  const fFrom = document.getElementById("fFrom");
  const fTo = document.getElementById("fTo");
  const fPreset = document.getElementById("fPreset");
  const customRange = document.getElementById("customRange");

  let statuses = Object.entries(STATUS_LABELS).map(([value, label]) => ({ value, label }));
  let services = [];
  let hasEmptyService = false;

  // --- Сортировка ---------------------------------------------------------

  const DEFAULT_SORT = { key: "date", dir: "desc" };
  const SORT_KEYS = ["date", "name", "phone", "service", "source", "status"];

  function readSort() {
    try {
      const saved = JSON.parse(sessionStorage.getItem("itd_admin_sort") || "null");
      if (saved && SORT_KEYS.includes(saved.key)) {
        return { key: saved.key, dir: saved.dir === "asc" ? "asc" : "desc" };
      }
    } catch { /* пусто */ }
    return { ...DEFAULT_SORT };
  }

  let sort = readSort();

  // --- Фильтры ------------------------------------------------------------

  // Множественный выбор: можно отметить сразу несколько статусов или источников.
  const EMPTY_FILTERS = {
    status: [], source: [], service: [],
    q: "", preset: "", from: "", to: ""
  };

  function readFilters() {
    try {
      const saved = JSON.parse(sessionStorage.getItem("itd_admin_filters") || "null");
      if (saved && typeof saved === "object") {
        return {
          status: Array.isArray(saved.status) ? saved.status : [],
          source: Array.isArray(saved.source) ? saved.source : [],
          service: Array.isArray(saved.service) ? saved.service : [],
          q: typeof saved.q === "string" ? saved.q : "",
          preset: typeof saved.preset === "string" ? saved.preset : "",
          from: typeof saved.from === "string" ? saved.from : "",
          to: typeof saved.to === "string" ? saved.to : ""
        };
      }
    } catch { /* пусто */ }
    return { ...EMPTY_FILTERS, status: [], source: [], service: [] };
  }

  let filters = readFilters();

  // --- Помощники ----------------------------------------------------------

  function formatDate(iso) {
    try {
      return new Intl.DateTimeFormat("ru-RU", {
        dateStyle: "short", timeStyle: "short", timeZone: "Europe/Moscow"
      }).format(new Date(iso));
    } catch {
      return iso;
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
  }

  function isoDay(date) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  /**
   * Считает границы периода для выбранного варианта.
   *
   * Неделя считается с понедельника, месяц — с первого числа.
   * Возвращает пустые строки, если период не выбран или задан вручную.
   */
  function presetRange(preset) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const shift = (days) => {
      const d = new Date(today);
      d.setDate(d.getDate() + days);
      return d;
    };

    // Понедельник текущей недели.
    const monday = (date) => {
      const d = new Date(date);
      const weekday = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - weekday);
      return d;
    };

    switch (preset) {
      case "today":
        return { from: isoDay(today), to: isoDay(today) };

      case "yesterday":
        return { from: isoDay(shift(-1)), to: isoDay(shift(-1)) };

      case "week": {
        return { from: isoDay(monday(today)), to: isoDay(today) };
      }

      case "lastWeek": {
        const start = monday(today);
        start.setDate(start.getDate() - 7);
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        return { from: isoDay(start), to: isoDay(end) };
      }

      case "month": {
        const start = new Date(today.getFullYear(), today.getMonth(), 1);
        return { from: isoDay(start), to: isoDay(today) };
      }

      case "lastMonth": {
        const start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        const end = new Date(today.getFullYear(), today.getMonth(), 0);
        return { from: isoDay(start), to: isoDay(end) };
      }

      case "7":
        return { from: isoDay(shift(-6)), to: isoDay(today) };

      case "30":
        return { from: isoDay(shift(-29)), to: isoDay(today) };

      default:
        return { from: "", to: "" };
    }
  }

  /** Пересчитывает даты фильтра по выбранному периоду. */
  function applyPreset() {
    if (filters.preset === "custom") {
      customRange.hidden = false;
      fFrom.value = filters.from;
      fTo.value = filters.to;
      return;
    }

    customRange.hidden = true;
    const range = presetRange(filters.preset);
    filters.from = range.from;
    filters.to = range.to;
    fFrom.value = filters.from;
    fTo.value = filters.to;
  }

  async function api(method, body, query) {
    const options = { method, credentials: "same-origin", headers: {} };

    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }

    const response = await fetch(`/api/leads${query || ""}`, options);
    let payload = {};
    try { payload = await response.json(); } catch { payload = {}; }
    return { status: response.status, payload };
  }

  function saveFilters() {
    sessionStorage.setItem("itd_admin_filters", JSON.stringify(filters));
  }

  function currentQuery() {
    const parts = new URLSearchParams();
    parts.set("sort", sort.key);
    parts.set("dir", sort.dir);

    // Несколько значений уходят одной строкой через запятую.
    if (filters.status.length) parts.set("status", filters.status.join(","));
    if (filters.source.length) parts.set("source", filters.source.join(","));
    if (filters.service.length) parts.set("service", filters.service.join(","));
    if (filters.q.trim()) parts.set("q", filters.q.trim());
    if (filters.from) parts.set("from", filters.from);
    if (filters.to) parts.set("to", filters.to);

    return `?${parts.toString()}`;
  }

  function renderSortIndicators() {
    document.querySelectorAll("button.sort").forEach((button) => {
      const active = button.dataset.sort === sort.key;
      button.dataset.active = active ? "true" : "false";
      const arrow = button.querySelector(".arrow");
      if (arrow) arrow.textContent = active ? (sort.dir === "asc" ? "↑" : "↓") : "↕";
    });
  }

  // --- Выпадающие списки с галочками --------------------------------------

  // Источники по умолчанию; сервер может прислать более полный список.
  let sourceOptions = Object.entries(SOURCE_LABELS).map(([value, label]) => ({ value, label }));

  const MULTI_OPTIONS = {
    status: () => statuses.map((s) => ({ value: s.value, label: s.label })),
    source: () => sourceOptions,
    service: () => {
      const options = services.map((value) => ({ value, label: value }));
      if (hasEmptyService) options.unshift({ value: "none", label: "(не выбрана)" });
      return options;
    }
  };


  /**
   * Рисует список значений фильтра.
   *
   * Список всегда раскрыт: раньше окно показывало кнопку «Все источники»,
   * и приходилось нажимать её второй раз, чтобы увидеть варианты.
   */
  function renderMulti(name) {
    const box = document.querySelector(`[data-multi="${name}"]`);
    if (!box) return;

    const options = MULTI_OPTIONS[name]();
    const panel = box.querySelector("[data-multi-panel]");

    // Снятые с учёта значения убираем из фильтра.
    const allowed = options.map((option) => option.value);
    const before = filters[name].length;
    filters[name] = filters[name].filter((value) => allowed.includes(value));
    if (filters[name].length !== before) saveFilters();

    if (options.length === 0) {
      panel.innerHTML = '<p class="multi-empty">Нет доступных значений</p>';
      return;
    }

    panel.innerHTML =
      options.map((option) => `
        <label>
          <input type="checkbox" value="${escapeHtml(option.value)}"${filters[name].includes(option.value) ? " checked" : ""} />
          <span>${escapeHtml(option.label)}</span>
        </label>`).join("") +
      '<div class="panel-actions"><button type="button" data-multi-clear>Снять всё</button></div>';
  }

  /**
   * Ставит окно фильтра точно под его кнопкой.
   *
   * Окно вынесено из таблицы (position: fixed), иначе оно обрезается
   * границами карточки, когда в таблице мало строк.
   */
  function positionPanel(panel, toggle) {
    const rect = toggle.getBoundingClientRect();
    const width = Math.max(rect.width, 230);
    const left = Math.min(rect.left, window.innerWidth - width - 12);
    const below = rect.bottom + 6;
    const panelHeight = panel.offsetHeight || 240;

    // Если снизу не помещается — открываем вверх.
    const openUp = below + panelHeight > window.innerHeight - 12;
    const top = openUp ? Math.max(12, rect.top - panelHeight - 6) : below;

    panel.style.left = `${Math.max(12, left)}px`;
    panel.style.top = `${top}px`;
    panel.style.width = `${width}px`;
  }

  /** Открывает или закрывает список значений в панели фильтров. */
  function toggleMulti(name, open) {
    const box = document.querySelector(`.filter-bar [data-multi="${name}"]`);
    if (!box) return;

    const willOpen = open === undefined ? box.dataset.open !== "true" : open;

    // Открытым может быть только один список.
    document.querySelectorAll(".filter-bar .multi").forEach((other) => {
      other.dataset.open = "false";
    });

    box.dataset.open = willOpen ? "true" : "false";
  }

  function closeAllMulti() {
    document.querySelectorAll(".filter-bar .multi").forEach((box) => {
      box.dataset.open = "false";
    });
  }

  /** Подписывает кнопку фильтра: «Все статусы» или «Выбрано: 2». */
  function renderToggleLabel(name) {
    const button = document.querySelector(`[data-fb-toggle="${name}"]`);
    if (!button) return;

    const options = MULTI_OPTIONS[name]();
    const chosen = filters[name];

    const placeholder = { status: "Все статусы", source: "Все источники", service: "Все услуги" }[name] || "Все";

    if (chosen.length === 0) {
      button.textContent = placeholder;
      button.dataset.filled = "false";
      return;
    }

    if (chosen.length === 1) {
      const only = options.find((option) => option.value === chosen[0]);
      button.textContent = only ? only.label : "1 выбрано";
    } else {
      button.textContent = `Выбрано: ${chosen.length}`;
    }

    button.dataset.filled = "true";
  }

  function renderAllMulti() {
    for (const name of Object.keys(MULTI_OPTIONS)) {
      renderMulti(name);
      renderToggleLabel(name);
    }
  }

  function closeAllPanels() {
    document.querySelectorAll("[data-multi-panel]").forEach((panel) => { panel.hidden = true; });
  }

  // --- Значки фильтров ----------------------------------------------------

  /** Что именно задано в фильтрах: нужно для значков и счётчика. */
  function activeFilters() {
    const { from, to } = periodRange();

    return {
      date: Boolean(from || to || filters.preset),
      search: Boolean(filters.q.trim()),
      service: filters.service.length > 0,
      source: filters.source.length > 0,
      status: filters.status.length > 0
    };
  }

  /** Показывает точку у значков, в которых есть активный фильтр. */
  function renderFilterMarks() {
    const active = activeFilters();

    document.querySelectorAll("[data-filter-toggle]").forEach((button) => {
      button.dataset.active = active[button.dataset.filterToggle] ? "true" : "false";
    });

    // В подписи столбца тоже полезно видеть, что фильтр включён.
    const count = Object.values(active).filter(Boolean).length;
    document.querySelectorAll("[data-filter-panel]").forEach((panel) => {
      panel.dataset.active = active[panel.dataset.filterPanel] ? "true" : "false";
    });

    return count;
  }



  // --- Загрузка -----------------------------------------------------------

  async function load() {
    renderSortIndicators();
    const { status, payload } = await api("GET", undefined, currentQuery());

    if (status === 401) {
      sessionStorage.removeItem("itd_admin_key");
      showLogin();
      loginError.textContent = "Сессия истекла, войдите заново";
      return;
    }

    if (!payload.ok) {
      updatedBox.textContent = payload.error || "Ошибка загрузки";
      return;
    }

    if (Array.isArray(payload.statuses) && payload.statuses.length) {
      statuses = payload.statuses;
    }

    render(payload.leads || []);
    await loadServices();
  }

  async function loadServices() {
    // Передаём выбранный источник: в списке услуг оставляем только те,
    // которые встречаются у заявок этого источника.
    const query = filters.source.length
      ? `?facets=1&source=${encodeURIComponent(filters.source.join(","))}`
      : "?facets=1";

    const { status, payload } = await api("GET", undefined, query);

    if (status === 200 && payload.ok) {
      services = payload.services || [];
      hasEmptyService = Boolean(payload.hasEmpty);

      // Источники приходят с подписями: новый источник не потеряется.
      if (Array.isArray(payload.sources) && payload.sources.length) {
        sourceOptions = payload.sources;
      }
    } else {
      services = [];
      hasEmptyService = false;
    }

    renderAllMulti();
  }

  function render(leads) {
    // Время сборки страницы нужно, чтобы отличать свежую версию от старой
    // из кэша браузера.
    const built = new Date(document.lastModified);

    updatedBox.textContent =
      `Обновлено: ${new Intl.DateTimeFormat("ru-RU", { timeStyle: "medium" }).format(new Date())}` +
      ` · найдено: ${leads.length}` +
      ` · сборка: ${new Intl.DateTimeFormat("ru-RU", { dateStyle: "short", timeStyle: "short" }).format(built)}`;

    const counts = {};
    for (const lead of leads) counts[lead.status] = (counts[lead.status] || 0) + 1;

    statsBox.innerHTML = statuses.map((s) => `
      <div class="stat"><b>${counts[s.value] || 0}</b><span>${escapeHtml(s.label)}</span></div>
    `).join("");

    emptyBox.hidden = leads.length > 0;

    rowsBody.innerHTML = leads.map((lead) => {
      const options = statuses.map((s) =>
        `<option value="${s.value}"${s.value === lead.status ? " selected" : ""}>${escapeHtml(s.label)}</option>`
      ).join("");

      return `
        <tr data-id="${escapeHtml(lead.id)}">
          <td class="nowrap">${escapeHtml(formatDate(lead.created_at))}</td>
          <td>${escapeHtml(lead.name)}</td>
          <td class="nowrap">${escapeHtml(lead.phone)}</td>
          <td>${escapeHtml(lead.service || "—")}</td>
          <td class="msg">${escapeHtml(lead.message || "—")}</td>
          <td class="source">${escapeHtml(SOURCE_LABELS[lead.source] || lead.source)}</td>
          <td class="nowrap">
            <select class="status-select" data-role="status">${options}</select>
            <span class="saved" data-role="saved" hidden>✓</span>
          </td>
        </tr>`;
    }).join("");
  }

  // --- Вход и выход -------------------------------------------------------

  async function login(key) {
    const { status, payload } = await api("POST", { key });

    if (status === 200 && payload.ok) {
      sessionStorage.setItem("itd_admin_key", key);
      showPanel();
      await load();
      return;
    }

    loginError.textContent = payload.error || "Не удалось войти";
    sessionStorage.removeItem("itd_admin_key");
  }

  function showPanel() { loginCard.hidden = true; panel.hidden = false; }

  function showLogin() {
    panel.hidden = true;
    loginCard.hidden = false;
    keyInput.value = "";
    keyInput.focus();
  }

  // --- Смена статуса ------------------------------------------------------

  async function changeStatus(row, select) {
    const id = row.getAttribute("data-id");
    const status = select.value;
    const saved = row.querySelector('[data-role="saved"]');

    select.disabled = true;
    saved.hidden = true;

    try {
      const { status: httpStatus, payload } = await api("PATCH", { id, status });

      if (httpStatus === 200 && payload.ok) {
        saved.hidden = false;
        setTimeout(() => { saved.hidden = true; }, 2000);
        return;
      }

      if (httpStatus === 401) {
        showLogin();
        loginError.textContent = "Сессия истекла, войдите заново";
        return;
      }

      alert(payload.error || "Не удалось сохранить статус");
      await load();
    } catch {
      alert("Сеть недоступна, статус не сохранён");
      await load();
    } finally {
      select.disabled = false;
    }
  }

  // --- События ------------------------------------------------------------

  document.getElementById("loginBtn").addEventListener("click", () => login(keyInput.value));
  keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") login(keyInput.value); });

  document.getElementById("refreshBtn").addEventListener("click", () => load());

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    sessionStorage.removeItem("itd_admin_key");
    await api("POST", { key: "" });
    showLogin();
  });

  rowsBody.addEventListener("change", (event) => {
    const select = event.target.closest('[data-role="status"]');
    if (select) changeStatus(select.closest("tr"), select);
  });

  // Сортировка по клику на заголовок.
  document.querySelector("thead").addEventListener("click", (event) => {
    const button = event.target.closest("button.sort");
    if (!button) return;

    const key = button.dataset.sort;
    if (sort.key === key) {
      sort.dir = sort.dir === "asc" ? "desc" : "asc";
    } else {
      sort = { key, dir: key === "date" ? "desc" : "asc" };
    }

    sessionStorage.setItem("itd_admin_sort", JSON.stringify(sort));
    load();
  });

  // Клики: значки в шапке, переключатели списков, галочки и сброс.
  document.addEventListener("click", (event) => {
    const filterToggle = event.target.closest("[data-filter-toggle]");
    const barToggle = event.target.closest("[data-fb-toggle]");
    const reset = event.target.closest("#resetFilters");
    const clearMulti = event.target.closest("[data-multi-clear]");
    const checkbox = event.target.closest(".multi-panel input[type=checkbox]");

    // Значок в шапке только подсвечивает нужный фильтр в панели.
    if (filterToggle) {
      event.stopPropagation();
      focusFilter(filterToggle.dataset.filterToggle);
      return;
    }

    if (barToggle) {
      event.stopPropagation();
      toggleMulti(barToggle.dataset.fbToggle);
      return;
    }

    if (reset) {
      filters = { ...EMPTY_FILTERS, status: [], source: [], service: [] };
      fPreset.value = "";
      fFrom.value = "";
      fTo.value = "";
      fSearch.value = "";
      customRange.hidden = true;
      saveFilters();
      renderAllMulti();
      renderFilterMarks();
      load();
      return;
    }

    if (clearMulti) {
      const name = clearMulti.closest("[data-multi]").dataset.multi;
      filters[name] = [];
      saveFilters();
      renderMulti(name);
      renderToggleLabel(name);
      renderFilterMarks();
      load();
      return;
    }

    if (checkbox) {
      const name = checkbox.closest("[data-multi]").dataset.multi;
      const value = checkbox.value;
      const set = new Set(filters[name]);
      checkbox.checked ? set.add(value) : set.delete(value);
      filters[name] = [...set];
      saveFilters();
      renderMulti(name);
      renderToggleLabel(name);
      renderFilterMarks();
      load();
      return;
    }

    // Клик мимо списка закрывает его.
    if (!event.target.closest(".filter-bar .multi")) closeAllMulti();
  });

  /** Подсвечивает нужный фильтр в панели и подводит к нему взгляд. */
  function focusFilter(name) {
    const item = document.querySelector(`.filter-bar [data-fb="${name}"]`);
    if (!item) return;

    // date и search не имеют списка — просто мягко подсвечиваем поле.
    if (["status", "source", "service"].includes(name)) {
      toggleMulti(name, true);
    }

    item.classList.add("fb-flash");
    setTimeout(() => item.classList.remove("fb-flash"), 1200);
  }

  // Окно привязано к своему столбцу, поэтому при прокрутке пересчитывать
  // ничего не нужно.

  // --- Период -------------------------------------------------------------

  fPreset.addEventListener("change", () => {
    filters.preset = fPreset.value;
    applyPreset();
    saveFilters();
    load();
  });

  // Даты: применяем сразу после выбора.
  let dateTimer = null;
  function applyDates() {
    clearTimeout(dateTimer);
    dateTimer = setTimeout(() => {
      filters.from = fFrom.value;
      filters.to = fTo.value;
      if (filters.from && filters.to && filters.from > filters.to) {
        filters.to = filters.from;
        fTo.value = filters.to;
      }
      saveFilters();
      load();
    }, 300);
  }

  fFrom.addEventListener("change", applyDates);
  fTo.addEventListener("change", applyDates);

  // Поиск: пауза в наборе, чтобы не дёргать базу на каждую букву.
  let searchTimer = null;
  fSearch.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      filters.q = fSearch.value;
      saveFilters();
      load();
    }, 350);
  });

  // --- Старт --------------------------------------------------------------

  fSearch.value = filters.q;
  fPreset.value = filters.preset;
  applyPreset();
  renderAllMulti();

  const savedKey = sessionStorage.getItem("itd_admin_key");
  if (savedKey) login(savedKey); else showLogin();
</script>
</body>
</html>
